<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#152A51" />
    <title>Offline · BodyInc</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f3f6f6;
        color: #152a51;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(100%, 420px);
        background: #fff;
        border: 1px solid #e8eeed;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.5;
        color: rgba(21, 42, 81, 0.75);
      }
      button {
        height: 46px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #e3e084;
        color: #152a51;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>BodyInc needs a connection to load your account. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
